<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Data flow of one turn. The copilot pane posts the workflow's steps to the server. The server loads the session file, builds the context, asks the model, checks the answer with retries, writes a reply and a trace record, and saves the session. The reply returns to the browser as a proposal; you apply it as console commands, the kernel runs the steps, and you press Continue.">
  <style>
    svg { --bg: #ffffff; --ink: #1c2329; --muted: #5a6670; --line: #c9d0d6; --you: #0f7a6c; --you-soft: #e3f3f0; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1a2126; --ink: #e3e8ec; --muted: #94a2ad; --line: #36424b; --you: #4cc4b2; --you-soft: #16302d; }
    }
    text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.3; }
    .store { fill: var(--bg); stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 2 3; }
    .youbox { fill: var(--you-soft); stroke: var(--you); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
    .edge.you { stroke: var(--you); }
    .edge.soft { stroke: var(--muted); stroke-dasharray: 4 4; }
    .boundary { stroke: var(--you); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .t { fill: var(--ink); font-size: 14px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 11.5px; }
    .l { fill: var(--ink); font-size: 11.5px; }
    .l.you { fill: var(--you); }
    .rl { fill: var(--muted); font-size: 11px; letter-spacing: .08em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .rl.you { fill: var(--you); }
    .ah { fill: var(--ink); }
    .ah.you { fill: var(--you); }
    .ah.soft { fill: var(--muted); }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah you" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah soft" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="820" height="330" rx="8"/>

  <rect class="store" x="320" y="20" width="180" height="36" rx="3"/>
  <text class="t" x="410" y="43" text-anchor="middle">Session file (JSON)</text>
  <path class="edge soft" d="M320 38 L105 38 L105 94" marker-end="url(#a2s)"/>
  <text class="l" x="200" y="32" text-anchor="middle">load</text>
  <path class="edge soft" d="M705 94 L705 38 L500 38" marker-end="url(#a2s)"/>
  <text class="l" x="610" y="32" text-anchor="middle">save, + trace record</text>

  <rect class="box" x="40" y="96" width="130" height="54" rx="6"/>
  <text class="t" x="105" y="119" text-anchor="middle">Context</text>
  <text class="s" x="105" y="137" text-anchor="middle">6 layers</text>
  <rect class="box" x="240" y="96" width="130" height="54" rx="6"/>
  <text class="t" x="305" y="119" text-anchor="middle">Model</text>
  <text class="s" x="305" y="137" text-anchor="middle">any LLM, JSON out</text>
  <rect class="box" x="440" y="96" width="130" height="54" rx="6"/>
  <text class="t" x="505" y="119" text-anchor="middle">Check</text>
  <text class="s" x="505" y="137" text-anchor="middle">tools, refs, names</text>
  <rect class="box" x="640" y="96" width="130" height="54" rx="6"/>
  <text class="t" x="705" y="119" text-anchor="middle">Reply</text>
  <text class="s" x="705" y="137" text-anchor="middle">plan or proposal</text>

  <line class="edge" x1="170" y1="123" x2="238" y2="123" marker-end="url(#a2)"/>
  <text class="l" x="204" y="116" text-anchor="middle">prompt</text>
  <line class="edge" x1="370" y1="123" x2="438" y2="123" marker-end="url(#a2)"/>
  <text class="l" x="404" y="116" text-anchor="middle">answer</text>
  <line class="edge" x1="570" y1="123" x2="638" y2="123" marker-end="url(#a2)"/>
  <text class="l" x="604" y="116" text-anchor="middle">passes</text>
  <path class="edge" d="M505 150 C505 184 305 184 305 152" marker-end="url(#a2)"/>
  <text class="l" x="405" y="194" text-anchor="middle">problems sent back · ≤ 2 retries</text>

  <line class="boundary" x1="20" y1="212" x2="800" y2="212"/>
  <text class="rl" x="800" y="206" text-anchor="end">SERVER PROPOSES</text>
  <text class="rl you" x="800" y="228" text-anchor="end">YOU DISPOSE</text>

  <rect class="youbox" x="40" y="244" width="130" height="54" rx="6"/>
  <text class="t" x="105" y="267" text-anchor="middle">Copilot pane</text>
  <text class="s" x="105" y="285" text-anchor="middle">Continue · Accept</text>
  <rect class="youbox" x="240" y="244" width="130" height="54" rx="6"/>
  <text class="t" x="305" y="267" text-anchor="middle">Kernel</text>
  <text class="s" x="305" y="285" text-anchor="middle">core runs steps</text>
  <rect class="youbox" x="440" y="244" width="130" height="54" rx="6"/>
  <text class="t" x="505" y="267" text-anchor="middle">Apply</text>
  <text class="s" x="505" y="285" text-anchor="middle">console commands</text>
  <rect class="youbox" x="640" y="244" width="130" height="54" rx="6"/>
  <text class="t" x="705" y="267" text-anchor="middle">Proposal card</text>
  <text class="s" x="705" y="285" text-anchor="middle">changes to review</text>

  <line class="edge" x1="705" y1="150" x2="705" y2="242" marker-end="url(#a2)"/>
  <text class="l" x="711" y="186">response</text>
  <line class="edge you" x1="640" y1="271" x2="572" y2="271" marker-end="url(#a2y)"/>
  <text class="l you" x="606" y="264" text-anchor="middle">you click</text>
  <line class="edge you" x1="440" y1="271" x2="372" y2="271" marker-end="url(#a2y)"/>
  <text class="l you" x="406" y="264" text-anchor="middle">add · set</text>
  <line class="edge you" x1="240" y1="271" x2="172" y2="271" marker-end="url(#a2y)"/>
  <text class="l you" x="206" y="264" text-anchor="middle">you run</text>
  <line class="edge you" x1="105" y1="244" x2="105" y2="152" marker-end="url(#a2y)"/>
  <text class="l you" x="111" y="186">POST …/turn</text>
  <text class="s" x="111" y="200">steps + states</text>
</svg>

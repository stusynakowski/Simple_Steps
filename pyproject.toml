[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-steps"
version = "0.0.0"
description = "Visual pipeline orchestrator for Python functions"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Stuart Synakowski"},
]
keywords = ["pipeline", "workflow", "orchestrator", "data", "no-code", "low-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]
dependencies = [
    # Pinned to a commit on purpose. An unpinned git URL resolves to core's
    # main at install time, which drifts from the submodule this repo is
    # developed against -- an older core lacks ResourceSpec and makes the
    # whole package unimportable. Bump this together with the submodule.
    "simple-steps-core @ git+https://github.com/stusynakowski/simple-steps-core.git@58bc115ec2f67ec784410c424a182aac47973995",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "importlib-metadata>=4.0; python_version<'3.10'",
    "websockets>=12.0",
    # Plotly figures are a cell type the UI draws interactively; the examples
    # chart with it, so it is installed by default rather than as an extra.
    "plotly>=5.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]
agent-anthropic = [
    "simple-steps[agent]",
    "langchain-anthropic>=0.2.0",
]
agent-ollama = [
    "simple-steps[agent]",
    "langchain-ollama>=0.2.0",
]
desktop = [
    "pywebview>=5.0",
]
# Rich cell types (docs/dev_plan/122 S4): Pillow images get their own cell
# view. Optional — numpy image arrays work without it.
media = [
    # Plotly is a regular dependency now; `[media]` adds Pillow image cells.
    "pillow>=10.0",
]
dev = [
    "simple-steps[media]",
    "pytest>=8.0",
    "httpx2>=0.28",
    "ruff>=0.6",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/stusynakowski/Simple_Steps"
Repository = "https://github.com/stusynakowski/Simple_Steps"
Issues = "https://github.com/stusynakowski/Simple_Steps/issues"

[project.scripts]
simple-steps = "SIMPLE_STEPS.cli:main"
simple-steps-local = "SIMPLE_STEPS.cli_local:main"
simple-steps-dev = "SIMPLE_STEPS.cli_dev:main"
simple-steps-bootstrap = "SIMPLE_STEPS.bootstrap_install:main"
# Rebuilds the bundled frontend. Needs the repo checkout (frontend/ is not
# shipped in the wheel); exits with a clear message otherwise.
simple-steps-build = "SIMPLE_STEPS.build_frontend:main"

[tool.setuptools]
package-dir = {"" = "src"}
# `python -m simple_steps run app.py` (a module name can't hold a hyphen).
py-modules = ["simple_steps"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["SIMPLE_STEPS*"]

[tool.setuptools.package-data]
# examples/ ships whole, whatever it holds: `simple-steps --load-examples`
# copies it into the working directory.
SIMPLE_STEPS = ["frontend_dist/**/*", "examples/**/*"]

[tool.setuptools.exclude-package-data]
SIMPLE_STEPS = ["examples/**/__pycache__/*", "examples/**/*.pyc", "examples/**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

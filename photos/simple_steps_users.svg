<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Simple Steps is the bridge between two kinds of experts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B636E"/>
    </marker>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2F6F8F"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="16" fill="#F7F7F5" stroke="#E2E2DE"/>
  <text x="480" y="42" font-size="19" font-weight="600" text-anchor="middle" fill="#1F2328">Simple Steps is the bridge between two kinds of experts</text>

  <!-- ===== Technical experts (left) ===== -->
  <circle cx="120" cy="140" r="18" fill="#0F766E"/>
  <path d="M90,192 A30,26 0 0 1 150,192 Z" fill="#0F766E"/>
  <text x="120" y="224" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2328">Technical experts</text>
  <text x="120" y="244" font-size="13" text-anchor="middle" fill="#5B636E">build and test the tools</text>
  <rect x="50" y="266" width="140" height="74" rx="8" fill="#1F2933"/>
  <rect x="62" y="280" width="70" height="6" rx="3" fill="#9CC4FF"/>
  <rect x="62" y="294" width="104" height="6" rx="3" fill="#E6EDF3"/>
  <rect x="76" y="308" width="86" height="6" rx="3" fill="#7EE2B8"/>
  <rect x="76" y="322" width="58" height="6" rx="3" fill="#E6EDF3"/>

  <text x="220" y="292" font-size="12" text-anchor="middle" fill="#5B636E">tools</text>
  <line x1="194" y1="303" x2="246" y2="303" stroke="#5B636E" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== Subject-matter experts (right) ===== -->
  <circle cx="840" cy="140" r="18" fill="#B45309"/>
  <path d="M810,192 A30,26 0 0 1 870,192 Z" fill="#B45309"/>
  <text x="840" y="224" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2328">Subject-matter experts</text>
  <text x="840" y="244" font-size="13" text-anchor="middle" fill="#5B636E">reach their goals</text>
  <rect x="770" y="266" width="140" height="74" rx="8" fill="#FFFFFF" stroke="#D0D4DA"/>
  <line x1="782" y1="328" x2="866" y2="328" stroke="#D0D4DA"/>
  <rect x="788" y="308" width="16" height="20" rx="2" fill="#F0B46B"/>
  <rect x="810" y="296" width="16" height="32" rx="2" fill="#E39A3E"/>
  <rect x="832" y="282" width="16" height="46" rx="2" fill="#B45309"/>
  <circle cx="886" cy="286" r="10" fill="#15803D"/>
  <path d="M881,286 l3.5,3.5 l6.5,-7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="738" y="292" font-size="12" text-anchor="middle" fill="#5B636E">results</text>
  <line x1="714" y1="303" x2="766" y2="303" stroke="#5B636E" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ===== The app, sitting on the bridge ===== -->
  <rect x="250" y="70" width="460" height="306" rx="12" fill="#FFFFFF" stroke="#C4C9D0"/>
  <path d="M250,98 V82 A12,12 0 0 1 262,70 H698 A12,12 0 0 1 710,82 V98 Z" fill="#F1F2F4"/>
  <line x1="250" y1="98" x2="710" y2="98" stroke="#D0D4DA"/>
  <circle cx="268" cy="84" r="4" fill="#D5D8DD"/>
  <circle cx="282" cy="84" r="4" fill="#D5D8DD"/>
  <circle cx="296" cy="84" r="4" fill="#D5D8DD"/>
  <text x="480" y="88" font-size="12" text-anchor="middle" fill="#5B636E">Simple Steps</text>

  <!-- Formula bar -->
  <rect x="262" y="108" width="286" height="28" rx="6" fill="#FFFFFF" stroke="#C4C9D0"/>
  <text x="272" y="126" font-size="12" font-style="italic" font-weight="600" fill="#2F6FDB">f(x)</text>
  <line x1="298" y1="114" x2="298" y2="130" stroke="#D0D4DA"/>
  <text x="306" y="126" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#1F2328">measure[mod.map()](wf["images"])</text>

  <!-- Grid: one column per step -->
  <g font-size="11">
    <rect x="262" y="146" width="286" height="22" fill="#EEF0F3" stroke="#D0D4DA"/>
    <rect x="400" y="146" width="70" height="22" fill="#DCE8FB" stroke="#2F6FDB"/>
    <text x="270" y="161" fill="#5B636E">files</text>
    <text x="336" y="161" fill="#5B636E">images</text>
    <text x="408" y="161" fill="#2F6FDB" font-weight="600">metrics</text>
    <text x="478" y="161" fill="#5B636E">plot</text>

    <rect x="262" y="168" width="286" height="120" fill="#FFFFFF" stroke="#D0D4DA"/>
    <line x1="262" y1="208" x2="548" y2="208" stroke="#E3E5E8"/>
    <line x1="262" y1="248" x2="548" y2="248" stroke="#E3E5E8"/>
    <line x1="328" y1="146" x2="328" y2="288" stroke="#E3E5E8"/>
    <line x1="470" y1="146" x2="470" y2="288" stroke="#E3E5E8"/>
    <rect x="400" y="168" width="70" height="120" fill="#F4F8FE" stroke="#2F6FDB"/>

    <text x="270" y="192" fill="#1F2328">scan_01</text>
    <text x="270" y="232" fill="#1F2328">scan_02</text>
    <text x="270" y="272" fill="#1F2328">scan_03</text>

    <rect x="338" y="174" width="52" height="28" rx="3" fill="url(#img)"/>
    <ellipse cx="356" cy="186" rx="8" ry="6" fill="#9FD3E6" opacity="0.8"/>
    <ellipse cx="374" cy="194" rx="5" ry="4" fill="#9FD3E6" opacity="0.6"/>
    <rect x="338" y="214" width="52" height="28" rx="3" fill="url(#img)"/>
    <ellipse cx="364" cy="228" rx="10" ry="7" fill="#9FD3E6" opacity="0.8"/>
    <rect x="338" y="254" width="52" height="28" rx="3" fill="url(#img)"/>
    <ellipse cx="352" cy="264" rx="6" ry="5" fill="#9FD3E6" opacity="0.7"/>
    <ellipse cx="373" cy="272" rx="8" ry="5" fill="#9FD3E6" opacity="0.8"/>

    <text x="408" y="192" fill="#1F2328">412.6</text>
    <text x="408" y="232" fill="#1F2328">398.1</text>
    <text x="408" y="272" fill="#1F2328">455.0</text>

    <g fill="#2F6FDB">
      <rect x="482" y="190" width="8" height="10" rx="1"/><rect x="494" y="184" width="8" height="16" rx="1"/><rect x="506" y="180" width="8" height="20" rx="1"/><rect x="518" y="186" width="8" height="14" rx="1"/>
      <rect x="482" y="226" width="8" height="14" rx="1"/><rect x="494" y="220" width="8" height="20" rx="1"/><rect x="506" y="228" width="8" height="12" rx="1"/><rect x="518" y="222" width="8" height="18" rx="1"/>
      <rect x="482" y="264" width="8" height="16" rx="1"/><rect x="494" y="270" width="8" height="10" rx="1"/><rect x="506" y="260" width="8" height="20" rx="1"/><rect x="518" y="266" width="8" height="14" rx="1"/>
    </g>
  </g>

  <!-- Progress -->
  <text x="262" y="312" font-size="11" fill="#5B636E">Running on every row</text>
  <text x="548" y="312" font-size="11" text-anchor="end" fill="#5B636E">1,400 of 2,000</text>
  <rect x="262" y="320" width="286" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="262" y="320" width="200" height="8" rx="4" fill="#2F6FDB"/>
  <text x="262" y="352" font-size="11" fill="#5B636E">Every step shows its data</text>

  <!-- AI assistant panel -->
  <line x1="558" y1="98" x2="558" y2="376" stroke="#E3E5E8"/>
  <circle cx="572" cy="119" r="4" fill="#6B4FCB"/>
  <text x="582" y="123" font-size="12" font-weight="600" fill="#1F2328">Assistant</text>
  <rect x="592" y="134" width="104" height="34" rx="8" fill="#EEF0F3"/>
  <text x="600" y="148" font-size="10.5" fill="#1F2328">Measure each</text>
  <text x="600" y="161" font-size="10.5" fill="#1F2328">image, please</text>
  <rect x="568" y="178" width="128" height="124" rx="8" fill="#FFFFFF" stroke="#8A6CE0" stroke-dasharray="4 3" stroke-width="1.4"/>
  <text x="578" y="196" font-size="10.5" font-weight="600" fill="#6B4FCB">Suggested step</text>
  <text x="578" y="214" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1F2328">measure[mod.map()]</text>
  <text x="578" y="227" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1F2328">  (wf["images"])</text>
  <rect x="578" y="244" width="54" height="22" rx="5" fill="#6B4FCB"/>
  <text x="605" y="259" font-size="10.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">Accept</text>
  <rect x="638" y="244" width="50" height="22" rx="5" fill="#FFFFFF" stroke="#C4C9D0"/>
  <text x="663" y="259" font-size="10.5" text-anchor="middle" fill="#1F2328">Reject</text>
  <text x="578" y="290" font-size="9.5" fill="#5B636E">Only your team's tools</text>

  <!-- ===== The bridge ===== -->
  <line x1="30" y1="480" x2="930" y2="480" stroke="#D0D4DA" stroke-width="1.5"/>
  <rect x="196" y="398" width="30" height="82" fill="#C9CED6"/>
  <rect x="734" y="398" width="30" height="82" fill="#C9CED6"/>
  <path d="M220,480 Q480,340 740,480" fill="none" stroke="#2F6FDB" stroke-width="4"/>
  <g stroke="#2F6FDB" stroke-width="2">
    <line x1="300" y1="398" x2="300" y2="443"/>
    <line x1="380" y1="398" x2="380" y2="420"/>
    <line x1="580" y1="398" x2="580" y2="420"/>
    <line x1="660" y1="398" x2="660" y2="443"/>
  </g>
  <rect x="190" y="382" width="580" height="16" rx="3" fill="#2F6FDB"/>
  <text x="480" y="394" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#FFFFFF">SIMPLE STEPS</text>

  <text x="480" y="514" font-size="13.5" text-anchor="middle" fill="#1F2328">Tools go in on one side, results come out on the other. The AI suggests steps; people decide.</text>
</svg>
